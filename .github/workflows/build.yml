name: Build NekoBox Android Release

on:
  push:
    branches:
      - main
  schedule:
    # Trigger weekly every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository and recursively fetch submodules (libcore, sing-box, etc.)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Set up Java Development Kit (JDK 17 required for modern AGP and Kotlin 1.9+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Set up Go environment required for building Go-based libcore
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: 'libcore/go.sum'

      # 4. Set up Android SDK and NDK components
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install gomobile and initialize Go mobile toolchain
      - name: Setup Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      # 6. Build the native libcore.aar binary using gomobile/gradle task
      - name: Build libcore.aar
        run: |
          if [ -f "./libcore/build.sh" ]; then
            cd libcore && bash build.sh
          else
            ./gradlew :libcore:build
          fi

      # 7. Grant execution permissions to Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 8. Compile the release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      # 9. Upload generated release APK as an action artifact
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoBox-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
